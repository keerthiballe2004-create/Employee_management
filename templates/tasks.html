
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6fa;font-family:Arial,sans-serif}
.sidebar{background:#172b4d;min-height:100vh;padding:25px 15px}
.sidebar h4{color:white;margin-bottom:30px}
.sidebar a{display:block;color:#dce5f2;text-decoration:none;padding:12px;border-radius:6px;margin-bottom:7px}
.sidebar a:hover,.sidebar a.active{background:#315b91;color:white}
.main{padding:30px}
.panel{background:white;padding:24px;border-radius:10px;box-shadow:0 2px 10px #0000000d;margin-bottom:25px}
.table th{background:#edf2f8}
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
<aside class="col-md-2 sidebar">
<h4>Employee Lifecycle</h4>
<a href="/api/dashboard/ui/">Dashboard</a>
<a href="/api/employees/ui/">Employees</a>
<a href="/api/onboarding/ui/">Onboarding</a>
<a href="/api/offboarding/ui/">Offboarding</a>
<a href="/api/tasks/ui/" class="active">Tasks</a>
<a href="/api/assets/ui/">Assets</a>
<a href="/api/access/ui/">Access Management</a>
</aside>

<main class="col-md-10 main">
<h2>Task Management</h2>
<p class="text-muted mb-4">Create, assign and track employee lifecycle tasks.</p>

<div class="panel">
<h5 class="mb-3">Create New Task</h5>
<div id="message"></div>
<form id="taskForm">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Task ID</label>
<input id="taskId" class="form-control" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Task Name</label>
<input id="taskName" class="form-control" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Department</label>
<select id="department" class="form-select" required>
<option value="HR">Human Resources</option>
<option value="IT">Information Technology</option>
<option value="FACILITIES">Facilities</option>
</select>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Assigned To</label>
<input id="assignedTo" class="form-control" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Due Date</label>
<input type="date" id="dueDate" class="form-control" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Employee</label>
<select id="employee" class="form-select" required>
<option value="">Select Employee</option>
</select>
</div>
<div class="col-md-4 mb-3">
<label class="form-label">Status</label>
<select id="status" class="form-select">
<option value="PENDING">Pending</option>
<option value="IN_PROGRESS">In Progress</option>
<option value="COMPLETED">Completed</option>
<option value="BLOCKED">Blocked</option>
</select>
</div>
<div class="col-md-4 mb-3">
<label class="form-label">Priority</label>
<select id="priority" class="form-select">
<option value="LOW">Low</option>
<option value="MEDIUM">Medium</option>
<option value="HIGH">High</option>
</select>
</div>
<div class="col-md-12 mb-3">
<label class="form-label">Description</label>
<textarea id="description" class="form-control" rows="2"></textarea>
</div>
</div>
<button type="submit" class="btn btn-primary">Create Task</button>
</form>
</div>

<div class="panel">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
<h5 class="mb-0">All Tasks</h5>
<input id="search" class="form-control" style="max-width:280px" placeholder="Search tasks...">
</div>
<p id="count" class="text-muted">Loading tasks...</p>
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead>
<tr>
<th>Task ID</th><th>Task Name</th><th>Employee</th>
<th>Department</th><th>Assigned To</th><th>Due Date</th>
<th>Status</th><th>Priority</th>
</tr>
</thead>
<tbody id="taskTable">
<tr><td colspan="8" class="text-center">Loading...</td></tr>
</tbody>
</table>
</div>
</div>
</main>
</div>
</div>

<script>
const TASK_API="/api/tasks/";
const EMPLOYEE_API="/api/employees/";
let tasks=[];

function getCookie(name){
    const cookies=document.cookie?document.cookie.split(";"):[];
    for(let cookie of cookies){
        cookie=cookie.trim();
        if(cookie.startsWith(name+"=")){
            return decodeURIComponent(cookie.substring(name.length+1));
        }
    }
    return "";
}

async function fetchAll(url){
    let results=[];
    while(url){
        const response=await fetch(url,{credentials:"same-origin"});
        if(!response.ok) throw new Error("Unable to load data. HTTP "+response.status);
        const data=await response.json();
        if(Array.isArray(data)){
            results.push(...data);
            url=null;
        }else{
            results.push(...(data.results||[]));
            url=data.next;
        }
    }
    return results;
}

function showMessage(message,type){
    document.getElementById("message").innerHTML=
        '<div class="alert alert-'+type+'">'+message+'</div>';
}

async function loadEmployees(){
    const select=document.getElementById("employee");
    try{
        const employees=await fetchAll(EMPLOYEE_API);
        select.innerHTML='<option value="">Select Employee</option>';
        employees.forEach(emp=>{
            const option=document.createElement("option");
            option.value=emp.employee_id;
            option.textContent=emp.employee_id+" - "+emp.first_name+" "+emp.last_name;
            select.appendChild(option);
        });
    }catch(error){
        showMessage(error.message,"danger");
    }
}

async function loadTasks(){
    try{
        tasks=await fetchAll(TASK_API);
        renderTasks();
    }catch(error){
        document.getElementById("taskTable").innerHTML=
            '<tr><td colspan="8" class="text-danger">'+error.message+'</td></tr>';
    }
}

function renderTasks(){
    const search=document.getElementById("search").value.toLowerCase();
    const filtered=tasks.filter(task=>
        [task.task_id,task.task_name,task.employee,task.department,
         task.assigned_to,task.status,task.priority]
        .some(value=>String(value||"").toLowerCase().includes(search))
    );

    document.getElementById("count").textContent=filtered.length+" task(s)";
    const table=document.getElementById("taskTable");
    table.innerHTML="";

    if(filtered.length===0){
        table.innerHTML='<tr><td colspan="8" class="text-center">No tasks found.</td></tr>';
        return;
    }

    filtered.forEach(task=>{
        const row=document.createElement("tr");
        [task.task_id,task.task_name,task.employee,task.department,
         task.assigned_to,task.due_date,task.status,task.priority]
        .forEach(value=>{
            const cell=document.createElement("td");
            cell.textContent=value??"";
            row.appendChild(cell);
        });
        table.appendChild(row);
    });
}

document.getElementById("search").addEventListener("input",renderTasks);

document.getElementById("taskForm").addEventListener("submit",async function(event){
    event.preventDefault();

    const payload={
        task_id:document.getElementById("taskId").value.trim(),
        task_name:document.getElementById("taskName").value.trim(),
        description:document.getElementById("description").value.trim(),
        department:document.getElementById("department").value,
        assigned_to:document.getElementById("assignedTo").value.trim(),
        due_date:document.getElementById("dueDate").value,
        status:document.getElementById("status").value,
        priority:document.getElementById("priority").value,
        employee:document.getElementById("employee").value
    };

    try{
        const response=await fetch(TASK_API,{
            method:"POST",
            credentials:"same-origin",
            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken":getCookie("csrftoken")
            },
            body:JSON.stringify(payload)
        });

        const data=await response.json();

        if(!response.ok){
            throw new Error(Object.entries(data).map(([key,value])=>
                key+": "+(Array.isArray(value)?value.join(", "):value)
            ).join(" | "));
        }

        showMessage("Task created successfully!","success");
        this.reset();
        await loadTasks();

    }catch(error){
        showMessage(error.message,"danger");
    }
});

loadEmployees();
loadTasks();
</script>
</body>
</html>
